<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Ejercicios</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/profesional/dashboard.css">
</head>
<body>
    {% include 'components/banner.html' %}

    <div class="container" style="max-width: 700px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 30px;">
    
            <div>
                <button type="button" onclick="history.back()" style="background-color: transparent; color: var(--color-parkin); border: 2px solid var(--color-parkin); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; width: auto; margin-bottom: 20px;">
                    ⬅️ Regresar
                </button>
            </div>
    
            <h2 style="color: var(--color-parkin); margin: 0; text-align: center; white-space: nowrap;">
                Gestión de Ejercicios
            </h2>
    
            <div></div>
    
        </div>
        
        <p style="color: #7f8c8d; margin-top: 10px;">Selecciona los ejercicios que el paciente deberá realizar.</p>
        
        <div style="background: #ecf0f1; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
            <strong>Paciente ID:</strong> <span id="id_paciente_display">--</span>
        </div>

        <div id="contenedor-ejercicios" style="margin-bottom: 20px; line-height: 2;">
            <p style="color: #3498db;">Cargando ejercicios disponibles...</p>
        </div>

        <button type="button" onclick="enviarPlan()" style="background: var(--color-parkin); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">
            Guardar Plan de Ejercicios
        </button>
    </div>

    <script>
        // --- FUNCIONES DEL BANNER ---
        function abrirSobreNosotros() { document.getElementById("modalSobreNosotros").style.display = "block"; }
        function cerrarSobreNosotros() { document.getElementById("modalSobreNosotros").style.display = "none"; }
        function cerrarSesion() { localStorage.clear(); window.location.href = "/"; }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pacienteId = urlParams.get('paciente');
            
            if (pacienteId) {
                document.getElementById('id_paciente_display').innerText = pacienteId;
            }

            try {
                const respuesta = await fetch('/api/lista_ejercicios');
                const ejercicios = await respuesta.json();
                
                let asignados = [];
                if (pacienteId) {
                    const respAsignados = await fetch(`/api/ejercicios_asignados/${pacienteId}`);
                    if (respAsignados.ok) {
                        asignados = await respAsignados.json(); 
                    }
                }

                const contenedor = document.getElementById('contenedor-ejercicios');
                contenedor.innerHTML = ''; 

                ejercicios.forEach(ej => {
                    const estaAsignado = asignados.map(Number).includes(Number(ej.id));
                    const marcarCasilla = estaAsignado ? "checked" : "";

                    contenedor.innerHTML += `
                        <label style="display: flex; align-items: center; cursor: pointer; padding: 5px 0;">
                            <input type="checkbox" value="${ej.id}" style="margin-right: 10px; width: auto; margin-bottom: 0;" ${marcarCasilla}>
                            <span>${ej.nombre}</span>
                        </label>
                    `;
                });

            } catch (error) {
                console.error("Error al cargar ejercicios:", error);
                document.getElementById('contenedor-ejercicios').innerHTML = '<p style="color:red;">Error al cargar la lista.</p>';
            }
        });

        async function enviarPlan() {
            const urlParams = new URLSearchParams(window.location.search);
            const pacienteId = urlParams.get('paciente');
            
            const seleccionados = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                                       .map(cb => parseInt(cb.value));

            if (seleccionados.length === 0) {
                alert("Por favor, selecciona al menos un ejercicio.");
                return;
            }

            try {
                const respuesta = await fetch('/api/guardar_plan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ paciente_id: pacienteId, ejercicios: seleccionados })
                });
                
                if(respuesta.ok) {
                    alert("¡Plan de ejercicios guardado con éxito!");
                } else {
                    alert("Hubo un error al guardar el plan.");
                }
            } catch(error) {
                console.error("Error:", error);
                alert("Error de conexión al guardar.");
            }
        }
    
        function regresarAlPanel() {
            const urlParams = new URLSearchParams(window.location.search);
            const pacienteId = urlParams.get('paciente');
            
            if (pacienteId) {
                window.location.href = `/dashboard-ps?paciente=${pacienteId}`;
            } else {
                window.location.href = "/dashboard-ps";
            }
        }
    </script>
</body>
</html>
